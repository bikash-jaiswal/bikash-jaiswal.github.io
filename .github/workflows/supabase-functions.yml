# Deploys Supabase Edge Functions when their source changes on main.
# Requires the SUPABASE_ACCESS_TOKEN repository secret:
#   Supabase Dashboard → Account → Access Tokens → Generate token
name: Deploy Supabase Edge Functions

on:
  push:
    branches: ['main']
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        run: supabase functions deploy enrich-link --project-ref gmfdpslpexvtfhrihzud
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
